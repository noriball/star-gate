<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STAR GATE — slit-scan</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0a0a0c; color:#cfd2d8; font:13px/1.4 system-ui,sans-serif; display:flex; height:100vh; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; min-width:0; }
  canvas { max-width:100%; max-height:100%; background:#000; }
  #panel { width:320px; overflow-y:auto; padding:12px 14px; border-left:1px solid #222; background:#111114; }
  #panel h1 { font-size:14px; margin:0 0 8px; letter-spacing:.1em; }
  #panel h2 { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:#8a8f99; margin:14px 0 4px; }
  .row { display:grid; grid-template-columns:110px 1fr 56px; gap:6px; align-items:center; margin:3px 0; }
  .row label { color:#aab; }
  .row output { text-align:right; font-variant-numeric:tabular-nums; color:#fff; }
  .row input[type=range] { width:100%; }
  select, button { background:#1c1c22; color:#ddd; border:1px solid #333; padding:3px 6px; border-radius:4px; }
  #info { color:#8a8f99; margin-top:10px; font-size:12px; white-space:pre-line; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="panel"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
